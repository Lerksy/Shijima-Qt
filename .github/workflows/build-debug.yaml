name: Build with CMake

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      build-configs:
        type: string
        default: '["Debug", "Release"]'
      artifact-prefix:
        type: string
        default: cmake

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, ubuntu-22.04, ubuntu-24.04-arm, macos-14]
        config: ${{ fromJSON(inputs.build-configs || '["Debug", "Release"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install 'cmake>=3.24,<4' ninja 'conan>=2.23,<3'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb-cursor0 libgl1-mesa-dev
      - name: Install Qt6
        uses: jdpurcell/install-qt-action@v5
        with:
          use-naqt: true
          version: '6.8.2'
          host: ${{ (matrix.runner == 'ubuntu-24.04-arm') && 'linux_arm64' || runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || matrix.runner == 'ubuntu-24.04-arm' && 'linux_gcc_arm64' || 'linux_gcc_64' }}
          modules: qtmultimedia
          cache: true
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=conan_provider.cmake \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DSHIJIMA_DEPLOY_QT=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/publish"
      - name: Check executable startup
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          if sys.platform == 'win32':
              executable = pathlib.Path('publish/bin/shijima-qt.exe')
          elif sys.platform == 'darwin':
              executable = pathlib.Path('publish/shijima-qt.app/Contents/MacOS/shijima-qt')
          else:
              executable = pathlib.Path('publish/bin/shijima-qt')
          # An invalid command exits 1. Loader failures, signals and crashes do not.
          result = subprocess.run([str(executable.resolve()), '--quiet', 'cmake-smoke-invalid-command'], timeout=30)
          assert result.returncode == 1, result.returncode
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix || 'cmake' }}-${{ matrix.runner }}-${{ matrix.config }}
          path: publish
          retention-days: 1
