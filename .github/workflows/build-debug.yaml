name: Build with CMake

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, ubuntu-22.04, ubuntu-24.04-arm, macos-14]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CMake and Ninja
        run: python -m pip install 'cmake>=3.24,<4' ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          $vcpkgPath = Join-Path $env:RUNNER_TEMP vcpkg
          git init $vcpkgPath
          git -C $vcpkgPath remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgPath fetch --depth 1 origin $baseline
          git -C $vcpkgPath checkout FETCH_HEAD
          & "$vcpkgPath/bootstrap-vcpkg.bat" -disableMetrics
          "CMAKE_TOOLCHAIN_FILE=$vcpkgPath/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgPath" >> $env:GITHUB_ENV
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libx11-dev libbz2-dev liblzma-dev zlib1g-dev libxcb-cursor0 libgl1-mesa-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install libarchive
      - name: Install Qt6
        uses: jdpurcell/install-qt-action@v5
        with:
          use-naqt: true
          version: '6.8.2'
          host: ${{ (matrix.runner == 'ubuntu-24.04-arm') && 'linux_arm64' || runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || matrix.runner == 'ubuntu-24.04-arm' && 'linux_gcc_arm64' || 'linux_gcc_64' }}
          modules: qtmultimedia
          cache: true
      - name: Configure
        shell: bash
        run: |
          prefix="$QT_ROOT_DIR"
          if [ "$RUNNER_OS" = macOS ]; then
            prefix="$prefix;$(brew --prefix libarchive)"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DCMAKE_PREFIX_PATH="$prefix" -DSHIJIMA_DEPLOY_QT=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Install
        run: cmake --install build --prefix "${{ github.workspace }}/publish"
      - name: Check executable startup
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          if sys.platform == 'win32':
              executable = pathlib.Path('publish/bin/shijima-qt.exe')
          elif sys.platform == 'darwin':
              executable = pathlib.Path('publish/shijima-qt.app/Contents/MacOS/shijima-qt')
          else:
              executable = pathlib.Path('publish/bin/shijima-qt')
          # An invalid command exits 1. Loader failures, signals and crashes do not.
          result = subprocess.run([str(executable.resolve()), '--quiet', 'cmake-smoke-invalid-command'], timeout=30)
          assert result.returncode == 1, result.returncode
      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: cmake-${{ matrix.runner }}-${{ matrix.config }}
          path: publish
          retention-days: 1
